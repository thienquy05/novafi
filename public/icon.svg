<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#3730A3"/>
      <stop offset="55%"  stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="cel" cx="50%" cy="30%" r="42%">
      <stop offset="0%"   stop-color="#A5B4FC" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="arm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#cel)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="white" stroke-opacity="0.07" stroke-width="2.5"/>
  <line x1="136" y1="378" x2="376" y2="378" stroke="white" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/>
  <line x1="136" y1="378" x2="256" y2="164" stroke="white" stroke-width="36" stroke-linecap="round" filter="url(#arm)"/>
  <line x1="376" y1="378" x2="256" y2="164" stroke="white" stroke-width="36" stroke-linecap="round" filter="url(#arm)"/>
  <g filter="url(#glow)">
    <path d="M256,88 L264,149 L322,158 L264,167 L256,228 L248,167 L190,158 L248,149 Z" fill="white" opacity="0.35"/>
    <path d="M256,104 L263,146 L308,158 L263,170 L256,212 L249,170 L204,158 L249,146 Z" fill="white"/>
    <circle cx="256" cy="158" r="8" fill="white"/>
  </g>
</svg>
