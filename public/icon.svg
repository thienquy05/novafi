<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NovaFi">
  <defs>
    <!-- Deep indigo → royal blue → bright azure: ties the mark to the app's
         indigo accent while keeping depth. -->
    <linearGradient id="nf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#312E81"/>
      <stop offset="45%"  stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#2E93D4"/>
    </linearGradient>

    <!-- Soft top-light for a glassy, premium sheen. -->
    <radialGradient id="nf-sheen" cx="32%" cy="14%" r="70%">
      <stop offset="0%"   stop-color="#BFE3FF" stop-opacity="0.40"/>
      <stop offset="55%"  stop-color="#BFE3FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#BFE3FF" stop-opacity="0"/>
    </radialGradient>

    <!-- The rising growth ribbon: white → cool silver. -->
    <linearGradient id="nf-ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E8F2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Golden nova star. -->
    <radialGradient id="nf-star" cx="50%" cy="42%" r="62%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="28%"  stop-color="#FFF1B8"/>
      <stop offset="70%"  stop-color="#F2C53D"/>
      <stop offset="100%" stop-color="#D69A12"/>
    </radialGradient>

    <filter id="nf-glow" x="-80%" y="-80%" width="260%" height="260%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nf-soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1E45" flood-opacity="0.30"/>
    </filter>

    <clipPath id="nf-clip">
      <rect x="0" y="0" width="512" height="512" rx="116" ry="116"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#nf-clip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#nf-bg)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#nf-sheen)"/>
    <!-- faint orbital arc for richness -->
    <circle cx="392" cy="150" r="240" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  </g>

  <!-- Ribbon rising to the nova -->
  <g clip-path="url(#nf-clip)">
    <path d="M104 372 C 168 360, 196 322, 238 300 C 286 274, 320 258, 388 168"
          fill="none" stroke="url(#nf-ribbon)" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#nf-soft)"/>
    <!-- data node where the line starts -->
    <circle cx="104" cy="372" r="13" fill="#E8F2FF"/>
  </g>

  <!-- Nova starburst at the apex -->
  <g filter="url(#nf-glow)">
    <!-- four-point sparkle -->
    <path d="M392 92
             C 400 150, 404 154, 462 162
             C 404 170, 400 174, 392 232
             C 384 174, 380 170, 322 162
             C 380 154, 384 150, 392 92 Z"
          fill="url(#nf-star)"/>
    <circle cx="392" cy="162" r="15" fill="#FFFFFF"/>
  </g>
  <!-- secondary twinkles -->
  <path d="M300 96 C 303 116, 305 118, 325 121 C 305 124, 303 126, 300 146 C 297 126, 295 124, 275 121 C 295 118, 297 116, 300 96 Z"
        fill="#FFF1B8" opacity="0.9"/>
  <path d="M446 232 C 448 244, 449 245, 461 247 C 449 249, 448 250, 446 262 C 444 250, 443 249, 431 247 C 443 245, 444 244, 446 232 Z"
        fill="#FFF1B8" opacity="0.75"/>
</svg>
