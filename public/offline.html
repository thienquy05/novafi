<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NovaFi — Offline</title>
    <link rel="icon" href="/icon.svg" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #e2e8f0; }
        .card { background: #1e293b !important; border-color: #334155 !important; }
        .sub { color: #94a3b8 !important; }
      }
      .card {
        max-width: 380px;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 40px 28px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      }
      img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 8px 24px rgba(21, 101, 163, 0.35); }
      h1 { font-size: 22px; margin: 20px 0 8px; letter-spacing: -0.02em; }
      .sub { color: #64748b; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        color: #fff;
        background: #4f46e5;
        padding: 12px 22px;
        border-radius: 14px;
        transition: background 0.15s ease;
      }
      button:hover { background: #4338ca; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="NovaFi" />
      <h1>You're offline</h1>
      <p class="sub">NovaFi needs a connection to load your latest finances. Check your network and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
