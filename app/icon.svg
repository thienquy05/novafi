<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="1" x2="0.8" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0B3B62"/>
      <stop offset="50%"  stop-color="#1565A3"/>
      <stop offset="100%" stop-color="#2E93D4"/>
    </linearGradient>
    <radialGradient id="atm" cx="50%" cy="18%" r="42%">
      <stop offset="0%"   stop-color="#7EC8E8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7EC8E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#D8EFFF" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFF0A8"/>
      <stop offset="45%"  stop-color="#E4BF40"/>
      <stop offset="100%" stop-color="#C49918"/>
    </linearGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0B3B62" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#atm)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="white" stroke-opacity="0.08" stroke-width="2.5"/>

  <!-- Crown open 3-tine silhouette + band -->
  <path d="M 136 396 L 136 354 L 148 354 L 170 228 L 192 354 L 224 354 L 256 148 L 288 354 L 320 354 L 342 228 L 364 354 L 376 354 L 376 396 Z"
        fill="url(#crown)" filter="url(#shadow)"/>

  <!-- Band top decorative separator -->
  <rect x="136" y="354" width="240" height="3" fill="white" fill-opacity="0.18"/>

  <!-- Gold gem dots on crown band -->
  <circle cx="176" cy="376" r="7"  fill="url(#gold)" opacity="0.80"/>
  <circle cx="216" cy="376" r="6"  fill="url(#gold)" opacity="0.70"/>
  <circle cx="256" cy="376" r="8"  fill="url(#gold)" opacity="0.92"/>
  <circle cx="296" cy="376" r="6"  fill="url(#gold)" opacity="0.70"/>
  <circle cx="336" cy="376" r="7"  fill="url(#gold)" opacity="0.80"/>

  <!-- Gold diamonds at side tine peaks -->
  <path d="M170,218 L178,228 L170,238 L162,228 Z" fill="url(#gold)" opacity="0.85"/>
  <path d="M342,218 L350,228 L342,238 L334,228 Z" fill="url(#gold)" opacity="0.85"/>

  <!-- 4-pointed star sparkle at center tine peak -->
  <g filter="url(#glow)">
    <path d="M256,92 L267,137 L312,148 L267,159 L256,204 L245,159 L200,148 L245,137 Z"
          fill="url(#gold)" opacity="0.40"/>
    <path d="M256,108 L267,137 L296,148 L267,159 L256,188 L245,159 L216,148 L245,137 Z"
          fill="url(#gold)"/>
    <circle cx="256" cy="148" r="6" fill="white"/>
  </g>
</svg>
